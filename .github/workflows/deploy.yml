name: Deploy Lithon Website

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
      - "benchmarks/results/latest.json"
      - "README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # The generators only read the source registry, never the build output,
      # and they write into web/apps/web/public/ — which Vite copies into the
      # artifact during build. Running them *after* build meant their output
      # was silently discarded, so the deployed sitemap/robots/llms files were
      # whatever happened to be committed. Generate first, then build.
      - name: Generate robots.txt and sitemap
        working-directory: web
        run: bun run scripts/gen-seo.ts "https://project-lithon.github.io/Lithon"

      # The AI-facing surfaces: a compact index and the whole documentation as
      # plain text, both generated from the same registry the site renders.
      - name: Generate the AI-facing surfaces
        working-directory: web
        run: bun run scripts/gen-llms.ts

      # TanStack Start prerenders every route to static HTML, so Pages can
      # host it.
      - name: Build site
        working-directory: web
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/apps/web/dist/client"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4