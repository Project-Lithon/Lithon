name: Lithon CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  docs:
    name: Docs verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Every example on the website is compiled by the real Lithon frontend
      # and pinned to the repo's regression outputs. This job is what makes
      # that claim true rather than aspirational: a doc that drifts from the
      # engine fails the build instead of misleading a reader.
      - name: Verify every docs example against the real toolchain
        working-directory: web
        run: bun run verify:docs

      # The generated IR and the AI-facing surfaces are committed, so they
      # have to match what the frontend produces today. The generators
      # normalise line endings, so the comparison is the same on every
      # platform.
      - name: Check the generated IR is up to date
        working-directory: web
        run: |
          bun scripts/gen-docs-ir.ts
          bun scripts/gen-playground-ir.ts
          git diff --exit-code -- apps/web/src/docs/generated/ir.ts apps/web/src/lib/playground-ir.ts

      - name: Type-check the web app
        working-directory: web
        run: bun run typecheck

      - name: Lint the web app
        working-directory: web
        run: bun run lint

  build-and-test:
    name: Build & Test (Ubuntu x86-64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++-12

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile C++ Engine (frontend/typecheck/interpreter pipeline)
        run: cmake --build build --config Release -j$(nproc)

      - name: Compile Zero-Dependency JIT Encoder Tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Isrc/jit -o encoder_test src/jit/encoder_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc/jit -o branch_test src/jit/branch_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc/jit -o stack_test src/jit/stack_test.cpp

      - name: Compile liveness & register-allocation tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Isrc -o liveness_test src/jit/liveness_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o regalloc_test src/jit/regalloc_test.cpp

      - name: Execute JIT Native Machine Code Tests
        run: |
          ./encoder_test
          ./branch_test
          ./stack_test

      - name: Execute liveness & register-allocation tests
        run: |
          ./liveness_test
          ./regalloc_test

      - name: Run Untyped Regression Suite (12/12 expected)
        run: python3 tools/run_regression.py

      - name: Run Typed Verification Suite (12/12 expected)
        run: python3 tools/run_typed_regression.py

      - name: Run Tier Differential Suite (JIT vs interpreter, byte-identical)
        run: python3 tools/run_tier_diff.py

      # The float formatter is the one function both engines call to render a
      # double, so it is checked directly against CPython's repr rules here
      # rather than only through a round-trip.
      - name: Compile & Run Float Formatting Test
        run: |
          g++ -std=c++20 -Wall -Wextra -Isrc/jit -o float_format_test src/jit/float_format_test.cpp
          ./float_format_test

      # --floats is separate from the general modes on purpose: the general
      # generator annotates every variable int[64] and emits no const_f64, so
      # without this the float paths are untested.
      - name: Fuzz Int/Float Programs Against Both Engines
        run: python3 tools/fuzz_diff.py --count 150 --floats

      # Separate mode for the same reason --floats is: bitwise operands and
      # out-of-range shift counts are shapes the general generator never
      # produces. This is the only randomized coverage of the shift
      # encodings and the RCX-destination case.
      - name: Fuzz Bitwise/Shift Programs Against Both Engines
        run: python3 tools/fuzz_diff.py --count 150 --bitwise

      # 1.2: CPUID detection is cross-checked against the kernel's own view
      # (/proc/cpuinfo + lscpu), and cpu_features_test's synthetic leaves pin
      # the bit mapping for CPU generations the CI host may not be.
      - name: CPU Target-Feature Detection (CPUID vs kernel)
        run: |
          ./build/cpu_features_test
          python3 tools/check_cpu_features.py

      # 1.3: guardrail for AVX codegen that does not exist yet. The self-test
      # assembles a deliberate VEX->legacy-SSE violation and requires the
      # scanner to catch it, so a green corpus scan is meaningful.
      - name: VEX Encoding Discipline (no legacy SSE after VEX)
        run: |
          python3 tools/check_vex_transitions.py --self-test
          python3 tools/check_vex_transitions.py

      # Guardrail that disassembles every compiled function and checks rsp is
      # 16-aligned at each `call` and callee-saved registers are restored at
      # each `ret`. The self-test assembles deliberate violations, so a clean
      # corpus scan is meaningful.
      - name: x64 ABI (stack alignment and callee-saved preservation)
        run: |
          python3 tools/check_stack_alignment.py --self-test
          python3 tools/check_stack_alignment.py --dir tests/typed_programs
          python3 tools/check_stack_alignment.py --dir tests/programs

      - name: Compile Liveness & Register Allocation Tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Isrc -o liveness_test src/jit/liveness_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o regalloc_test src/jit/regalloc_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_function_test src/jit/compile_function_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_function_branch_test src/jit/compile_function_branch_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_function_loop_test src/jit/compile_function_loop_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_module_call_test src/jit/compile_module_call_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_module_fib_test src/jit/compile_module_fib_test.cpp
          g++ -std=c++20 -O2 -Isrc -o benchmark_fib src/jit/benchmark_fib.cpp src/interpreter/interpreter.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_module_bool_print_test src/jit/compile_module_bool_print_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -o compile_function_diamond_test src/jit/compile_function_diamond_test.cpp
          g++ -std=c++20 -Wall -Wextra -Isrc -Isrc/jit -o optimize_lsr_test src/jit/optimize_lsr_test.cpp src/ir/text_parser.cpp

      - name: Execute compile_function & module tests (incl. liveness/regalloc)
        run: |
          ./compile_function_test
          ./compile_function_branch_test
          ./compile_function_loop_test
          ./compile_module_call_test
          ./compile_module_fib_test
          ./benchmark_fib
          ./compile_module_bool_print_test
          ./compile_function_diamond_test
          ./optimize_lsr_test

  # 4.16: the Microsoft x64 ABI. The JIT is built for Windows with MinGW and run
  # under wine: a probe checks every callee-saved register (RBX RDI RSI R12-R15,
  # XMM6-XMM15) survives a JIT call, and every program in the typed regression and
  # programs suites runs identically on the Windows interpreter and native tier.
  win64-wine:
    name: Win64 ABI (MinGW build under wine)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MinGW and wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-win32 g++-mingw-w64-i686-win32 wine64 wine32:i386 binutils-mingw-w64-i686

      # The 32-bit checks compare against the 64-bit tiers, so build that reference first.
      - name: Build the 64-bit reference runner
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -Isrc -Isrc/jit -o build/tier_runner src/jit/tier_runner.cpp src/ir/text_parser.cpp src/interpreter/interpreter.cpp src/typecheck/typecheck.cpp

      - name: x86-32 encoder (every form decodes as intended)
        run: python3 tools/check_x86_32_encoding.py --require

      - name: Win64 ABI + x86-32 native tier checks
        run: python3 tools/check_win64.py --require

      - name: x86-32 native tier differential fuzzing
        run: |
          for mode in "" "--floats" "--mod" "--bitwise" "--break" "--diamond" "--lsr" "--phi" "--oop"; do
            python3 tools/fuzz_x86_32.py --count 60 $mode
          done

  # The same checks on a real Windows host (MSYS2 MinGW-w64), where nothing is
  # emulated. Not yet proven green on a real runner, so it does not block merges
  # until it has run once; remove continue-on-error after the first clean run.
  win64-native:
    name: Win64 ABI (native Windows)
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      - name: Win64 ABI checks
        shell: msys2 {0}
        run: python tools/check_win64.py --require

  # 4.17: System V i386, executed natively. A 64-bit kernel runs 32-bit ELF binaries, so
  # no emulator is needed: the same corpus as the Win32 job, an ESP-alignment probe on
  # every call, differential fuzzing, and the exported cdecl/stdcall/fastcall entries.
  sysv-i386:
    name: x86-32 native tier (System V i386)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Build the 64-bit reference runner
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -Isrc -Isrc/jit -o build/tier_runner src/jit/tier_runner.cpp src/ir/text_parser.cpp src/interpreter/interpreter.cpp src/typecheck/typecheck.cpp

      - name: System V i386 corpus + alignment probe
        run: python3 tools/check_sysv32.py --require

      - name: System V i386 differential fuzzing
        run: |
          for mode in "" "--floats" "--mod" "--bitwise" "--break" "--diamond" "--lsr" "--phi" "--oop"; do
            LITHON_CHECK_ALIGN=1 python3 tools/fuzz_x86_32.py --sysv --count 60 $mode
          done

      - name: Exported C calling conventions
        run: python3 tools/check_x86_32_conv.py --require
